<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e2c" />
    <title>Starcharts</title>
    <meta name="description" content="A shared night sky for the people you love. Give each other stars for meaningful acts. When the sky fills, the chart becomes a memory." />

    <!--
      Open Graph + Twitter cards. We use HashRouter, so social-media
      scrapers only ever see this <head> regardless of which deep link
      a user shares — these tags are the entire preview surface.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Starcharts" />
    <meta property="og:title" content="Starcharts — a shared night sky" />
    <meta property="og:description" content="Give each other stars for meaningful acts. When the sky fills, the chart becomes a memory." />
    <meta property="og:url" content="https://stars.realm.watch/" />
    <meta property="og:image" content="https://stars.realm.watch/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The word Starcharts in gold serif type, scattered against a deep-purple star-flecked sky." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starcharts — a shared night sky" />
    <meta name="twitter:description" content="Give each other stars for meaningful acts. When the sky fills, the chart becomes a memory." />
    <meta name="twitter:image" content="https://stars.realm.watch/og.png" />
    <meta name="twitter:image:alt" content="The word Starcharts in gold serif type, scattered against a deep-purple star-flecked sky." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
