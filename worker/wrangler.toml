name = "starcharts-summon"
main = "src/index.ts"
compatibility_date = "2026-05-03"

# Keep the workers.dev fallback URL alive (LAN smoke tests, manual
# debugging when summon.stars.realm.watch is acting up). Newer
# wrangler defaults to false; we explicitly opt in.
workers_dev = true
preview_urls = true

# Workers Logs (real-time tail + persisted logs in dashboard).
[observability]
enabled = true

# Account ID is intentionally left commented. Either:
#   1) run `wrangler login` (auto-resolves), or
#   2) uncomment and paste your Cloudflare account ID, or
#   3) export CLOUDFLARE_ACCOUNT_ID before deploy.
# account_id = ""

# R2 bucket for the generated PNGs. The bucket itself must already exist
# (`wrangler r2 bucket create starcharts-customs`). See worker/README.md.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "starcharts-customs"

# KV namespace for rate-limit counters (per-group / day, per-IP / hour).
# Provisioned 2026-05-03 via `wrangler kv namespace create starcharts-rate-limits`.
# Counters use TTL so the namespace stays self-cleaning.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "ab111d1d263e4f2bab253a1e19e7d82f"

# Custom domain: summon.stars.realm.watch.
# Cloudflare will create the DNS + cert automatically when this is enabled
# (assuming the realm.watch zone is in this account, which it is).
[[routes]]
pattern = "summon.stars.realm.watch"
custom_domain = true

# Local-dev secrets live in .dev.vars (gitignored). For production,
# set them via `wrangler secret put AZURE_OPENAI_API_KEY`, etc.
# Required secrets:
#   AZURE_OPENAI_ENDPOINT
#   AZURE_OPENAI_API_KEY
#   AZURE_OPENAI_DEPLOYMENT
#   AZURE_OPENAI_API_VERSION
#   PUBLIC_BUCKET_URL  (optional — public R2 URL prefix; falls back to /r2/<key>)
