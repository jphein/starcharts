<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starcharts</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g' cx='50%25' cy='50%25' r='50%25'><stop offset='0%25' stop-color='%23fff4cc'/><stop offset='40%25' stop-color='%23f5c46b'/><stop offset='100%25' stop-color='%23080a1c'/></radialGradient></defs><circle cx='16' cy='16' r='15' fill='%23080a1c'/><path d='M16 4 L18 14 L28 16 L18 18 L16 28 L14 18 L4 16 L14 14 Z' fill='url(%23g)'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=EB+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f0eee9; }
    body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font-family: inherit; }
    /* Polish for the design canvas frames */
    .sc-frame {
      border-radius: 28px; overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 6px 20px rgba(0,0,0,0.08);
      background: #050714;
    }
    .sc-frame-mobile {
      border-radius: 36px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.22), 0 6px 24px rgba(0,0,0,0.1),
                  inset 0 0 0 6px #1a1a1a, inset 0 0 0 7px #2a2a2a;
      padding: 10px;
    }
    .sc-frame-desktop {
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.18), 0 6px 20px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="tokens.jsx"></script>
  <script type="text/babel" src="stars.jsx"></script>
  <script type="text/babel" src="sky.jsx"></script>
  <script type="text/babel" src="preset-preview.jsx"></script>
  <script type="text/babel" src="screens-a.jsx"></script>
  <script type="text/babel" src="screens-b.jsx"></script>
  <script type="text/babel" src="screens-c.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Wrap each App instance in a fixed device frame so they share state independently.
    function MobileFrame({ children }) {
      return (
        <div className="sc-frame sc-frame-mobile" style={{
          width: 390, height: 780, position: 'relative',
        }}>
          <div style={{ position: 'absolute', inset: 10, borderRadius: 28, overflow: 'hidden', background: '#050714' }}>
            {children}
          </div>
          {/* Dynamic-island */}
          <div style={{
            position: 'absolute', top: 18, left: '50%', transform: 'translateX(-50%)',
            width: 110, height: 30, borderRadius: 20, background: '#000', zIndex: 200,
          }} />
        </div>
      );
    }

    function DesktopFrame({ children }) {
      return (
        <div className="sc-frame sc-frame-desktop" style={{
          width: 1280, height: 800, position: 'relative',
          background: '#050714',
        }}>
          {/* Browser chrome */}
          <div style={{
            height: 40, background: '#e8e6e0', display: 'flex', alignItems: 'center',
            padding: '0 16px', gap: 8, borderBottom: '1px solid rgba(0,0,0,0.08)',
          }}>
            <div style={{ display: 'flex', gap: 6 }}>
              <div style={{ width: 11, height: 11, borderRadius: 999, background: '#ff5f57' }} />
              <div style={{ width: 11, height: 11, borderRadius: 999, background: '#febc2e' }} />
              <div style={{ width: 11, height: 11, borderRadius: 999, background: '#28c840' }} />
            </div>
            <div style={{
              flex: 1, maxWidth: 480, margin: '0 auto', padding: '5px 12px',
              background: 'rgba(255,255,255,0.7)', borderRadius: 6,
              fontFamily: '-apple-system, system-ui', fontSize: 12, color: '#5a5a5a',
              textAlign: 'center', letterSpacing: '0.02em',
            }}>
              ✦ stars.realm.watch
            </div>
            <div style={{ width: 60 }} />
          </div>
          <div style={{ position: 'absolute', top: 40, left: 0, right: 0, bottom: 0, overflow: 'hidden' }}>
            {children}
          </div>
        </div>
      );
    }

    const App = window.SC_APP.App;
    const TWEAK_DEFAULTS = window.SC_APP.TWEAK_DEFAULTS;
    const { DesignCanvas, DCSection, DCArtboard } = window;
    const { TweaksPanel, TweakSection, TweakRadio, TweakSelect } = window;

    // Shared tweaks state across both App instances.
    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <>
          <TweaksPanel>
            <TweakSection label="Theme" />
            <TweakRadio label="Mode" value={t.theme} options={['dark', 'light']} onChange={(v) => setTweak('theme', v)} />
            <TweakSelect label="Sky palette" value={t.palette}
              options={Object.entries(window.SC_TOKENS.SKY_PALETTES).map(([k, v]) => ({ value: k, label: v.label }))}
              onChange={(v) => setTweak('palette', v)} />
            <TweakSelect label="Typography" value={t.type}
              options={Object.entries(window.SC_TOKENS.TYPE_PAIRINGS).map(([k, v]) => ({ value: k, label: v.label }))}
              onChange={(v) => setTweak('type', v)} />
            <TweakSection label="Sky behavior" />
            <TweakRadio label="Density" value={t.density} options={['sparse', 'regular', 'dense']} onChange={(v) => setTweak('density', v)} />
            <TweakRadio label="Animation" value={t.animation} options={['still', 'drifty', 'lively']} onChange={(v) => setTweak('animation', v)} />
            <TweakSection label="Sample data" />
            <TweakRadio label="Persona" value={t.persona} options={['family', 'couple', 'friends']} onChange={(v) => setTweak('persona', v)} />
          </TweaksPanel>
          <DesignCanvas>
            <DCSection id="prototype" title="Starcharts" subtitle="Mobile + desktop · 8 scenes · dark+light · use chip bar to jump scenes · use Tweaks (toolbar toggle) for theme/palette/persona">
              <DCArtboard id="mobile" label="Mobile · 390×780" width={390} height={780}>
                <MobileFrame>
                  <App t={t} setTweak={setTweak} />
                </MobileFrame>
              </DCArtboard>
              <DCArtboard id="desktop" label="Desktop · 1280×800" width={1280} height={800}>
                <DesktopFrame>
                  <App t={t} setTweak={setTweak} />
                </DesktopFrame>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
