name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  push-perms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Push InstantDB permissions
        working-directory: app
        env:
          INSTANT_TOKEN: ${{ secrets.INSTANT_TOKEN }}
        run: |
          if [ -z "$INSTANT_TOKEN" ]; then
            echo "INSTANT_TOKEN secret not set — skipping perms push."
            echo "Add INSTANT_TOKEN to Settings → Secrets and variables → Actions to enable automatic perms deployment."
            exit 0
          fi
          npx instant-cli push perms -a e526d9cf-e783-4a99-b3b3-a69730ecdd7e -t "$INSTANT_TOKEN" --yes

  push-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Push InstantDB schema
        working-directory: app
        env:
          INSTANT_TOKEN: ${{ secrets.INSTANT_TOKEN }}
        run: |
          if [ -z "$INSTANT_TOKEN" ]; then
            echo "INSTANT_TOKEN secret not set — skipping schema push."
            exit 0
          fi
          npx instant-cli push schema -a e526d9cf-e783-4a99-b3b3-a69730ecdd7e -t "$INSTANT_TOKEN" --yes

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
